<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brok3n by Design — Indie Game Studio</title>
  <meta name="description" content="Brok3n by Design makes strange, story-driven games. Play Pocket Wilds and tune in to WRFM, a synchronized live game-radio station.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230b0b0b'/><text x='50' y='70' font-size='56' font-family='monospace' fill='%2300ff9f' text-anchor='middle'>B3</text></svg>">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
    }

    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
    }

    video {
      max-width: 96%;
      max-height: 90%;
      width: auto;
      height: auto;
      object-fit: contain;
      transform: translateY(-5vh);
    }

    .enter-btn {
      position: absolute;
      bottom: 13vh;
      left: 50%;
      transform: translateX(-50%);
      padding: 18px 60px;
      font-size: 1.6rem;
      background: transparent;
      border: 2px solid #00ff9f;
      color: #00ff9f;
      font-family: "Courier New", monospace;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .enter-btn:hover,
    .enter-btn:focus-visible {
      background-color: #00ff9f;
      color: #000;
    }

    .enter-btn:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }
  </style>
  <link rel="stylesheet" href="site-effects.css">
  <script src="site-effects.js" defer></script>
</head>
<body>

  <div class="video-container">
    <video id="splashVideo" autoplay muted loop playsinline>
      <source src="videos/BrokenIntro.mp4" type="video/mp4">
    </video>

    <button class="enter-btn" id="enterBtn" onclick="enterSite()">
      ENTER
    </button>
  </div>

  <script>
    function enterSite() {
      if (window.B3DEffects) {
        window.B3DEffects.navigate("home.html");
      } else {
        window.location.href = "home.html";
      }
    }
  </script>

</body>
</html>
