<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brok3n by Design — Independent Game Studio</title>
  <meta name="description" content="Brok3n by Design is an independent game studio where each project is designed, directed, and built by a single creator using modern creative tools.">
  <link rel="icon" href="images/studio/studio-mark.svg">
  <style>
body { margin:0; background:#000; color:#eee; font-family:monospace; }
.video-container { min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:20px; box-sizing:border-box; }
.entrance-logo { display:block; width:min(100%,850px); height:auto; max-height:58svh; object-fit:contain; }
.intro-actions { display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center; }
.enter-btn { display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box; min-height:44px; padding:8px 20px; font-size:.85rem; line-height:1.2; border:1px solid #ff686e; color:#ff686e; text-decoration:none; }
.enter-btn:hover { background:#ff686e; color:#00150c; }
.intro-credit { margin:0; font-size:.85rem; line-height:1.5; color:#bbb; }
.intro-actions label { display:flex; gap:10px; align-items:center; min-height:44px; font-size:.9rem; }
.intro-actions input { width:20px; height:20px; accent-color:#ff686e; }
#intro-note { min-height:1em; margin:0; font-size:.8rem; color:#9cbaa7; }
@media(max-height:500px) and (min-width:700px){.video-container{flex-direction:row;} .entrance-logo{width:55%;max-height:85svh;}.intro-actions{max-width:40%;}}
</style>
  <link rel="stylesheet" href="site-effects.css?v=20260912-titles">
  <link rel="stylesheet" href="studio.css">
  <script src="studio-data.js" defer></script>
  <script src="studio-core.js" defer></script>
  <script src="site-effects.js?v=20260912-titles" defer></script>
  <script src="intro.js" defer></script>
<meta property="og:image" content="https://brok3nbydesign.com/images/studio/b3d.png">
<link rel="canonical" href="https://brok3nbydesign.com/">
<link rel="stylesheet" href="site-music.css">
<script src="site-music.js" defer></script>
</head>
<body>

  <main class="video-container">
  <h1 class="sr-only">Brok3n by Design — Independent Game Studio</h1>
  <img class="entrance-logo" src="images/studio/b3d-web.webp" alt="Brok3n by Design" width="1040" height="416">
  <div class="intro-actions">
    <a class="enter-btn" href="home.html">ENTER THE STUDIO</a>
    <label hidden><input type="checkbox" id="remember-intro">Go straight to the games next time</label>
    <p class="intro-credit">Independently created by Brok3n by Design.</p>
    <p id="intro-note" role="status"></p>
  </div>
</main>
<div class="site-music" id="site-music-control" role="group" aria-label="Background music"><button type="button" aria-pressed="false">♫ Play music</button><label><span class="sr-only">Music volume</span><input type="range" min="0" max="100" step="1" aria-label="Music volume"></label></div>
</body>
</html>
